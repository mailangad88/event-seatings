# Lighthouse CI: performance, image weight, accessibility and SEO scores for key pages.
# Runs after each successful Vercel production deployment, weekly, and on demand.
# Reports are uploaded to Lighthouse's free temporary public storage; links appear in the run log.
# Assertions only warn, so a slow page never blocks a deploy.
name: Lighthouse

on:
  deployment_status:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    if: github.event_name != 'deployment_status' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE: ${{ vars.SITE_URL || 'https://beyondchiavari.vercel.app' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run Lighthouse CI
        run: |
          npx --yes @lhci/cli@0.16.0 autorun \
            --config=./lighthouserc.json \
            --collect.url="$BASE/" \
            --collect.url="$BASE/rentals" \
            --collect.url="$BASE/rentals/chairs" \
            --collect.url="$BASE/quote" \
            --collect.url="$BASE/tools/tent-size" \
            --collect.url="$BASE/blog"
