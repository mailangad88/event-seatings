<text x="822" y="408" font-family="Cormorant Garamond, Georgia, 'Times New Roman', serif" font-size="26" fill="#efe4cf" text-anchor="start" font-weight="400" letter-spacing="0">Level ground</text>
<text x="822" y="436" font-family="Jost, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#a89d87" text-anchor="start" font-weight="400" letter-spacing="0">Away from neighboring graves</text>
<circle cx="790" cy="510" r="18" fill="#c9a96a"/>
<text x="790" y="516" font-family="Jost, 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#0a0806" text-anchor="middle" font-weight="500" letter-spacing="0">4</text>
<text x="822" y="508" font-family="Cormorant Garamond, Georgia, 'Times New Roman', serif" font-size="26" fill="#efe4cf" text-anchor="start" font-weight="400" letter-spacing="0">Cemetery rules</text>
<text x="822" y="536" font-family="Jost, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#a89d87" text-anchor="start" font-weight="400" letter-spacing="0">Ask what vendors may bring</text>
<text x="600" y="690" font-family="Jost, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#a89d87" text-anchor="middle" font-weight="400" letter-spacing="1" font-style="italic">Schematic, not to scale. Every cemetery sets its own rules.</text></svg>