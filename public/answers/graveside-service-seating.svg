<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="t"><title id="t">Schematic graveside service layout: a tent over the casket or urn, two front rows of chairs for close family, other guests standing behind, and a firm path from the parking area</title>
