<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="t"><title id="t">Career or job fair seating layout: a check-in table at the front, recruiter booths along the wall each with chairs for staff and one candidate chair, and a waiting row of chairs for candidates between booths</title>
