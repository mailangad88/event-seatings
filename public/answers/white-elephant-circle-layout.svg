<text x="600" y="336" font-family="Jost, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#c9a96a" text-anchor="middle" font-weight="500" letter-spacing="1.5">GIFT PILE</text>
<text x="600" y="535" font-family="Jost, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#a89d87" text-anchor="middle" font-weight="400" letter-spacing="0">One circle of chairs, numbers drawn in order, gifts stay visible to everyone</text>
<text x="600" y="565" font-family="Jost, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#a89d87" text-anchor="middle" font-weight="400" letter-spacing="1" font-style="italic">No head table needed: every seat has an equal view and an equal turn.</text></svg>