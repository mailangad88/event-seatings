<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="t"><title id="t">White elephant gift exchange seating layout: a single circle of chairs around a central gift pile, so every seat has an equal view of the gifts and the draw order</title>
