<text x="600" y="122" font-family="Cormorant Garamond, Georgia, 'Times New Roman', serif" font-size="30" fill="#efe4cf" text-anchor="middle" font-weight="300" letter-spacing="0">A single circle, so every chair can see the gift pile and the draw</text>
