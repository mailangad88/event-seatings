<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 570" width="1200" height="570" role="img" aria-labelledby="t"><title id="t">Restaurant buyout chair swap timeline: confirm the plan weeks before, clear the room after service, swap in rental chairs, host the event, then strike and return the house chairs</title>
<rect width="1200" height="570" fill="#1a1713"/><rect x="12" y="12" width="1176" height="546" fill="none" stroke="#c9a96a" stroke-opacity=".45"/>
<text x="600" y="70" font-family="Jost, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#c9a96a" text-anchor="middle" font-weight="500" letter-spacing="3">RESTAURANT BUYOUT CHAIR SWAP</text>
<text x="600" y="122" font-family="Cormorant Garamond, Georgia, 'Times New Roman', serif" font-size="36" fill="#efe4cf" text-anchor="middle" font-weight="300" letter-spacing="0">The tight window between service and your guests</text>
<line x1="120" y1="260" x2="1080" y2="260" stroke="#c9a96a" stroke-opacity=".6" stroke-width="2"/>
<rect x="320" y="236" width="320" height="48" fill="#c9a96a" fill-opacity=".12"/>
<text x="480.0" y="226" font-family="Jost, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#c9a96a" text-anchor="middle" font-weight="500" letter-spacing="2">THE CRUNCH: OFTEN JUST A FEW HOURS</text>
<circle cx="120" cy="260" r="12" fill="#1a1713" stroke="#c9a96a" stroke-width="2"/>
<text x="120.0" y="330" font-family="Jost, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#c9a96a" text-anchor="middle" font-weight="500" letter-spacing="2.5">WEEKS BEFORE</text>
<text x="120.0" y="370" font-family="Cormorant Garamond, Georgia, 'Times New Roman', serif" font-size="26" fill="#efe4cf" text-anchor="middle" font-weight="400" letter-spacing="0">Confirm the plan</text>
<text x="120.0" y="404" font-family="Jost, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#a89d87" text-anchor="middle" font-weight="400" letter-spacing="0">Where house chairs go,</text>
<text x="120.0" y="428" font-family="Jost, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#a89d87" text-anchor="middle" font-weight="400" letter-spacing="0">load-in door, COI</text>
<circle cx="360" cy="260" r="12" fill="#c9a96a" stroke="#c9a96a" stroke-width="2"/>
<text x="360.0" y="330" font-family="Jost, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#c9a96a" text-anchor="middle" font-weight="500" letter-spacing="2.5">SERVICE ENDS</text>
<text x="360.0" y="370" font-family="Cormorant Garamond, Georgia, 'Times New Roman', serif" font-size="26" fill="#efe4cf" text-anchor="middle" font-weight="400" letter-spacing="0">Clear the room</text>
<text x="360.0" y="404" font-family="Jost, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#a89d87" text-anchor="middle" font-weight="400" letter-spacing="0">Restaurant stacks or</text>
<text x="360.0" y="428" font-family="Jost, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#a89d87" text-anchor="middle" font-weight="400" letter-spacing="0">stores its chairs</text>
<circle cx="600" cy="260" r="12" fill="#c9a96a" stroke="#c9a96a" stroke-width="2"/>
<text x="600.0" y="330" font-family="Jost, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#c9a96a" text-anchor="middle" font-weight="500" letter-spacing="2.5">LOAD-IN</text>
<text x="600.0" y="370" font-family="Cormorant Garamond, Georgia, 'Times New Roman', serif" font-size="26" fill="#efe4cf" text-anchor="middle" font-weight="400" letter-spacing="0">Swap and set</text>
<text x="600.0" y="404" font-family="Jost, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#a89d87" text-anchor="middle" font-weight="400" letter-spacing="0">Rental chairs in,</text>
<text x="600.0" y="428" font-family="Jost, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#a89d87" text-anchor="middle" font-weight="400" letter-spacing="0">tables dressed</text>
<circle cx="840" cy="260" r="12" fill="#1a1713" stroke="#c9a96a" stroke-width="2"/>
<text x="840.0" y="330" font-family="Jost, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#c9a96a" text-anchor="middle" font-weight="500" letter-spacing="2.5">YOUR EVENT</text>
<text x="840.0" y="370" font-family="Cormorant Garamond, Georgia, 'Times New Roman', serif" font-size="26" fill="#efe4cf" text-anchor="middle" font-weight="400" letter-spacing="0">Guests arrive</text>
<text x="840.0" y="404" font-family="Jost, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#a89d87" text-anchor="middle" font-weight="400" letter-spacing="0">Ceremony rows flip to</text>
<text x="840.0" y="428" font-family="Jost, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#a89d87" text-anchor="middle" font-weight="400" letter-spacing="0">dinner if needed</text>
<circle cx="1080" cy="260" r="12" fill="#1a1713" stroke="#c9a96a" stroke-width="2"/>
<text x="1080.0" y="330" font-family="Jost, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#c9a96a" text-anchor="middle" font-weight="500" letter-spacing="2.5">CLOSE</text>
<text x="1080.0" y="370" font-family="Cormorant Garamond, Georgia, 'Times New Roman', serif" font-size="26" fill="#efe4cf" text-anchor="middle" font-weight="400" letter-spacing="0">Strike</text>
<text x="1080.0" y="404" font-family="Jost, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#a89d87" text-anchor="middle" font-weight="400" letter-spacing="0">Rentals out, house</text>
<text x="1080.0" y="428" font-family="Jost, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#a89d87" text-anchor="middle" font-weight="400" letter-spacing="0">chairs back for</text>
<text x="1080.0" y="452" font-family="Jost, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#a89d87" text-anchor="middle" font-weight="400" letter-spacing="0">tomorrow</text>
<text x="600" y="520" font-family="Jost, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#a89d87" text-anchor="middle" font-weight="400" letter-spacing="0">Typical sequence. Every restaurant sets its own access times, so confirm yours in writing.</text></svg>