<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-labelledby="t"><title id="t">When to book event chairs: 9 to 12 months for peak Saturdays, 4 to 6 months for most events, final count 6 to 8 weeks out, last minute 1 to 2 weeks</title>
<rect width="1200" height="470" fill="#1a1713"/><rect x="12" y="12" width="1176" height="446" fill="none" stroke="#c9a96a" stroke-opacity=".45"/>
<text x="600" y="70" font-family="Jost, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#c9a96a" text-anchor="middle" font-weight="500" letter-spacing="3">WHEN TO BOOK EVENT CHAIRS</text>
<text x="600" y="122" font-family="Cormorant Garamond, Georgia, 'Times New Roman', serif" font-size="36" fill="#efe4cf" text-anchor="middle" font-weight="300" letter-spacing="0">The earlier the date, the more styles you can choose from</text>
<line x1="120" y1="260" x2="1080" y2="260" stroke="#c9a96a" stroke-width="2"/>
<circle cx="180" cy="260" r="12" fill="#c9a96a" stroke="#c9a96a" stroke-width="2"/>
<text x="180" y="225" font-family="Cormorant Garamond, Georgia, 'Times New Roman', serif" font-size="30" fill="#efe4cf" text-anchor="middle" font-weight="400" letter-spacing="0">9–12 mo</text>
<text x="180" y="310" font-family="Jost, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#c9a96a" text-anchor="middle" font-weight="500" letter-spacing="2.5">PEAK SATURDAYS</text>
<text x="180" y="342" font-family="Jost, 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#a89d87" text-anchor="middle" font-weight="400" letter-spacing="0">June–October weddings</text>
<circle cx="460" cy="260" r="12" fill="#1a1713" stroke="#c9a96a" stroke-width="2"/>
<text x="460" y="225" font-family="Cormorant Garamond, Georgia, 'Times New Roman', serif" font-size="30" fill="#efe4cf" text-anchor="middle" font-weight="400" letter-spacing="0">4–6 mo</text>
<text x="460" y="310" font-family="Jost, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#c9a96a" text-anchor="middle" font-weight="500" letter-spacing="2.5">MOST EVENTS</text>
<text x="460" y="342" font-family="Jost, 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#a89d87" text-anchor="middle" font-weight="400" letter-spacing="0">Pick styles, hold a quote</text>
<circle cx="740" cy="260" r="12" fill="#1a1713" stroke="#c9a96a" stroke-width="2"/>
<text x="740" y="225" font-family="Cormorant Garamond, Georgia, 'Times New Roman', serif" font-size="30" fill="#efe4cf" text-anchor="middle" font-weight="400" letter-spacing="0">6–8 wk</text>
<text x="740" y="310" font-family="Jost, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#c9a96a" text-anchor="middle" font-weight="500" letter-spacing="2.5">FINAL COUNT</text>
<text x="740" y="342" font-family="Jost, 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#a89d87" text-anchor="middle" font-weight="400" letter-spacing="0">Confirm guests and layout</text>
<circle cx="1020" cy="260" r="12" fill="#1a1713" stroke="#c9a96a" stroke-width="2"/>
<text x="1020" y="225" font-family="Cormorant Garamond, Georgia, 'Times New Roman', serif" font-size="30" fill="#efe4cf" text-anchor="middle" font-weight="400" letter-spacing="0">1–2 wk</text>
<text x="1020" y="310" font-family="Jost, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#c9a96a" text-anchor="middle" font-weight="500" letter-spacing="2.5">LAST MINUTE</text>
<text x="1020" y="342" font-family="Jost, 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#a89d87" text-anchor="middle" font-weight="400" letter-spacing="0">Classic styles, ask fast</text>
<text x="600" y="420" font-family="Jost, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#a89d87" text-anchor="middle" font-weight="400" letter-spacing="0">Typical planning guidance, not a guarantee. Availability depends on your date.</text></svg>