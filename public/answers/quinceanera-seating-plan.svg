<text x="810" y="206" font-family="Jost, 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#0a0806" text-anchor="middle" font-weight="500" letter-spacing="0">1</text>
<text x="842" y="198" font-family="Cormorant Garamond, Georgia, 'Times New Roman', serif" font-size="26" fill="#efe4cf" text-anchor="start" font-weight="400" letter-spacing="0">Throne chair</text>
<text x="842" y="226" font-family="Jost, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#a89d87" text-anchor="start" font-weight="400" letter-spacing="0">For the quinceañera, on the stage</text>
<circle cx="810" cy="310" r="18" fill="#c9a96a"/>
<text x="810" y="316" font-family="Jost, 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#0a0806" text-anchor="middle" font-weight="500" letter-spacing="0">2</text>
