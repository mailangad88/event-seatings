<text x="600" y="70" font-family="Jost, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#c9a96a" text-anchor="middle" font-weight="500" letter-spacing="3">QUINCEAÑERA SEATING PLAN</text>
<text x="600" y="122" font-family="Cormorant Garamond, Georgia, 'Times New Roman', serif" font-size="40" fill="#efe4cf" text-anchor="middle" font-weight="300" letter-spacing="0">Four kinds of seats, one room</text>
