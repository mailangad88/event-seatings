<text x="842" y="336" font-family="Jost, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#a89d87" text-anchor="start" font-weight="400" letter-spacing="0">Damas, chambelanes and escort</text>
<circle cx="810" cy="420" r="18" fill="#c9a96a"/>
<text x="810" y="426" font-family="Jost, 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#0a0806" text-anchor="middle" font-weight="500" letter-spacing="0">3</text>
<text x="842" y="418" font-family="Cormorant Garamond, Georgia, 'Times New Roman', serif" font-size="26" fill="#efe4cf" text-anchor="start" font-weight="400" letter-spacing="0">Family + padrinos</text>
<text x="842" y="446" font-family="Jost, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#a89d87" text-anchor="start" font-weight="400" letter-spacing="0">Closest to the floor for the dances</text>
<circle cx="810" cy="530" r="18" fill="#c9a96a"/>
<text x="810" y="536" font-family="Jost, 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#0a0806" text-anchor="middle" font-weight="500" letter-spacing="0">4</text>
<text x="842" y="528" font-family="Cormorant Garamond, Georgia, 'Times New Roman', serif" font-size="26" fill="#efe4cf" text-anchor="start" font-weight="400" letter-spacing="0">Guests</text>
<text x="842" y="556" font-family="Jost, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#a89d87" text-anchor="start" font-weight="400" letter-spacing="0">Everyone else, plus a small buffer</text>
<text x="600" y="700" font-family="Jost, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#a89d87" text-anchor="middle" font-weight="400" letter-spacing="1" font-style="italic">Schematic, not to scale. Every venue layout is different.</text></svg>