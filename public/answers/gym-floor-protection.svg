<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-labelledby="t"><title id="t">How to protect a hardwood gym floor at an event: a floor cover over the event area, glides on chair and table feet, and soft-wheeled carts rolled on the cover</title>
<rect width="1200" height="640" fill="#1a1713"/><rect x="12" y="12" width="1176" height="616" fill="none" stroke="#c9a96a" stroke-opacity=".45"/>
<text x="600" y="70" font-family="Jost, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#c9a96a" text-anchor="middle" font-weight="500" letter-spacing="3">EVENTS ON A GYM FLOOR</text>
<text x="600" y="122" font-family="Cormorant Garamond, Georgia, 'Times New Roman', serif" font-size="38" fill="#efe4cf" text-anchor="middle" font-weight="300" letter-spacing="0">Protect the hardwood before the chairs come in</text>
<rect x="90" y="470" width="550" height="60" fill="#8a6a43"/>
<line x1="90" y1="470" x2="90" y2="530" stroke="#5b4630"/>
<line x1="136" y1="470" x2="136" y2="530" stroke="#5b4630"/>
<line x1="182" y1="470" x2="182" y2="530" stroke="#5b4630"/>
<line x1="228" y1="470" x2="228" y2="530" stroke="#5b4630"/>
<line x1="274" y1="470" x2="274" y2="530" stroke="#5b4630"/>
<line x1="320" y1="470" x2="320" y2="530" stroke="#5b4630"/>
<line x1="366" y1="470" x2="366" y2="530" stroke="#5b4630"/>
<line x1="412" y1="470" x2="412" y2="530" stroke="#5b4630"/>
<line x1="458" y1="470" x2="458" y2="530" stroke="#5b4630"/>
<line x1="504" y1="470" x2="504" y2="530" stroke="#5b4630"/>
<line x1="550" y1="470" x2="550" y2="530" stroke="#5b4630"/>
<line x1="596" y1="470" x2="596" y2="530" stroke="#5b4630"/>
<text x="365.0" y="508" font-family="Jost, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#f5ecd9" text-anchor="middle" font-weight="500" letter-spacing="2.5">HARDWOOD GYM FLOOR</text>
<rect x="90" y="450" width="550" height="20" fill="#c9a96a" fill-opacity=".55"/>
<text x="652" y="465" font-family="Jost, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#a89d87" text-anchor="start" font-weight="400" letter-spacing="0">Floor cover</text>
<g fill="none" stroke="#efe4cf" stroke-width="5" stroke-linecap="round"><path d="M250 300 V448 M340 300 V448 M250 380 H370 M370 380 V448 M250 300 H340"/></g>
<rect x="241" y="440" width="18" height="10" rx="3" fill="#c9a96a"/>
<rect x="331" y="440" width="18" height="10" rx="3" fill="#c9a96a"/>
<rect x="361" y="440" width="18" height="10" rx="3" fill="#c9a96a"/>
<text x="310" y="280" font-family="Jost, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#a89d87" text-anchor="middle" font-weight="500" letter-spacing="2">CHAIR</text>
<rect x="460" y="360" width="140" height="60" fill="none" stroke="#efe4cf" stroke-width="3"/>
<circle cx="480" cy="436" r="13" fill="#2b2318" stroke="#c9a96a" stroke-width="3"/>
<circle cx="580" cy="436" r="13" fill="#2b2318" stroke="#c9a96a" stroke-width="3"/>
<text x="530" y="345" font-family="Jost, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#a89d87" text-anchor="middle" font-weight="500" letter-spacing="2">CART</text>
<circle cx="760" cy="200" r="18" fill="#c9a96a"/>
<text x="760" y="206" font-family="Jost, 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#0a0806" text-anchor="middle" font-weight="500" letter-spacing="0">1</text>
<text x="792" y="198" font-family="Cormorant Garamond, Georgia, 'Times New Roman', serif" font-size="26" fill="#efe4cf" text-anchor="start" font-weight="400" letter-spacing="0">Cover the floor</text>
<text x="792" y="226" font-family="Jost, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#a89d87" text-anchor="start" font-weight="400" letter-spacing="0">Tarp, vinyl or carpet over the event area</text>
<circle cx="760" cy="300" r="18" fill="#c9a96a"/>
<text x="760" y="306" font-family="Jost, 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#0a0806" text-anchor="middle" font-weight="500" letter-spacing="0">2</text>
<text x="792" y="298" font-family="Cormorant Garamond, Georgia, 'Times New Roman', serif" font-size="26" fill="#efe4cf" text-anchor="start" font-weight="400" letter-spacing="0">Protect the feet</text>
<text x="792" y="326" font-family="Jost, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#a89d87" text-anchor="start" font-weight="400" letter-spacing="0">Glides or caps on every chair and table leg</text>
<circle cx="760" cy="400" r="18" fill="#c9a96a"/>
<text x="760" y="406" font-family="Jost, 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#0a0806" text-anchor="middle" font-weight="500" letter-spacing="0">3</text>
<text x="792" y="398" font-family="Cormorant Garamond, Georgia, 'Times New Roman', serif" font-size="26" fill="#efe4cf" text-anchor="start" font-weight="400" letter-spacing="0">Roll, don't drag</text>
<text x="792" y="426" font-family="Jost, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#a89d87" text-anchor="start" font-weight="400" letter-spacing="0">Soft-wheeled carts on the cover, never bare wheels</text>
<circle cx="760" cy="500" r="18" fill="#c9a96a"/>
<text x="760" y="506" font-family="Jost, 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#0a0806" text-anchor="middle" font-weight="500" letter-spacing="0">4</text>
<text x="792" y="498" font-family="Cormorant Garamond, Georgia, 'Times New Roman', serif" font-size="26" fill="#efe4cf" text-anchor="start" font-weight="400" letter-spacing="0">Ask the custodian</text>
<text x="792" y="526" font-family="Jost, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#a89d87" text-anchor="start" font-weight="400" letter-spacing="0">The school or church sets the rules</text>
<text x="600" y="600" font-family="Jost, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#a89d87" text-anchor="middle" font-weight="400" letter-spacing="1" font-style="italic">Schematic. Every facility has its own floor policy, so confirm it in writing.</text></svg>