<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-labelledby="t"><title id="t">Five venue rules to ask about: insurance, access, timing, floors and strike</title>
<rect width="1200" height="660" fill="#1a1713"/><rect x="12" y="12" width="1176" height="636" fill="none" stroke="#c9a96a" stroke-opacity=".45"/>
<text x="600" y="70" font-family="Jost, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#c9a96a" text-anchor="middle" font-weight="500" letter-spacing="3">VENUE RULES TO ASK ABOUT</text>
<text x="600" y="122" font-family="Cormorant Garamond, Georgia, 'Times New Roman', serif" font-size="36" fill="#efe4cf" text-anchor="middle" font-weight="300" letter-spacing="0">What Chicago venues usually want from a rental company</text>
<circle cx="110" cy="205" r="26" fill="none" stroke="#c9a96a"/>
<text x="110" y="215" font-family="Cormorant Garamond, Georgia, 'Times New Roman', serif" font-size="28" fill="#c9a96a" text-anchor="middle" font-weight="400" letter-spacing="0">1</text>
<line x1="110" y1="231" x2="110" y2="261" stroke="#c9a96a" stroke-opacity=".5"/>
<text x="170" y="199" font-family="Jost, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#c9a96a" text-anchor="start" font-weight="500" letter-spacing="2.5">INSURANCE</text>
<text x="170" y="227" font-family="Jost, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#efe4cf" text-anchor="start" font-weight="400" letter-spacing="0">Certificate of insurance (COI) naming the venue</text>
<circle cx="110" cy="287" r="26" fill="none" stroke="#c9a96a"/>
<text x="110" y="297" font-family="Cormorant Garamond, Georgia, 'Times New Roman', serif" font-size="28" fill="#c9a96a" text-anchor="middle" font-weight="400" letter-spacing="0">2</text>
<line x1="110" y1="313" x2="110" y2="343" stroke="#c9a96a" stroke-opacity=".5"/>
<text x="170" y="281" font-family="Jost, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#c9a96a" text-anchor="start" font-weight="500" letter-spacing="2.5">ACCESS</text>
<text x="170" y="309" font-family="Jost, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#efe4cf" text-anchor="start" font-weight="400" letter-spacing="0">Loading dock, freight elevator and parking for the truck</text>
<circle cx="110" cy="369" r="26" fill="none" stroke="#c9a96a"/>
<text x="110" y="379" font-family="Cormorant Garamond, Georgia, 'Times New Roman', serif" font-size="28" fill="#c9a96a" text-anchor="middle" font-weight="400" letter-spacing="0">3</text>
<line x1="110" y1="395" x2="110" y2="425" stroke="#c9a96a" stroke-opacity=".5"/>
<text x="170" y="363" font-family="Jost, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#c9a96a" text-anchor="start" font-weight="500" letter-spacing="2.5">TIMING</text>
<text x="170" y="391" font-family="Jost, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#efe4cf" text-anchor="start" font-weight="400" letter-spacing="0">Load-in and load-out windows, often tight</text>
<circle cx="110" cy="451" r="26" fill="none" stroke="#c9a96a"/>
<text x="110" y="461" font-family="Cormorant Garamond, Georgia, 'Times New Roman', serif" font-size="28" fill="#c9a96a" text-anchor="middle" font-weight="400" letter-spacing="0">4</text>
<line x1="110" y1="477" x2="110" y2="507" stroke="#c9a96a" stroke-opacity=".5"/>
<text x="170" y="445" font-family="Jost, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#c9a96a" text-anchor="start" font-weight="500" letter-spacing="2.5">FLOORS</text>
<text x="170" y="473" font-family="Jost, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#efe4cf" text-anchor="start" font-weight="400" letter-spacing="0">Protection for wood floors, carpet or lawn</text>
<circle cx="110" cy="533" r="26" fill="none" stroke="#c9a96a"/>
<text x="110" y="543" font-family="Cormorant Garamond, Georgia, 'Times New Roman', serif" font-size="28" fill="#c9a96a" text-anchor="middle" font-weight="400" letter-spacing="0">5</text>
<text x="170" y="527" font-family="Jost, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#c9a96a" text-anchor="start" font-weight="500" letter-spacing="2.5">STRIKE</text>
<text x="170" y="555" font-family="Jost, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#efe4cf" text-anchor="start" font-weight="400" letter-spacing="0">When chairs must be stacked and gone</text>
<text x="600" y="618" font-family="Jost, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#a89d87" text-anchor="middle" font-weight="400" letter-spacing="0">Ask your venue coordinator for their vendor packet before you book rentals.</text></svg>